<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Meow Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">K Meow Shop</div>
    <nav>
      <a href="#productos">Productos</a>
      <a href="#preorders">Preorders</a>
      <a href="#gos">GOs</a>
      <a href="https://instagram.com/k_meow._" target="_blank">@k_meow._</a>
    </nav>
    <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>K Meow Shop</h1>
      <p>Photocards, álbumes y preorders originales de K-pop.</p>
      <a href="#productos" class="primary-btn">Ver productos</a>
    </div>
  </section>

  <section class="toolbar">
    <input id="searchInput" type="text" placeholder="Buscar photocards, álbumes...">
    <select id="groupFilter">
      <option value="all">Todos los grupos</option>
      <option value="ENHYPEN">ENHYPEN</option>
      <option value="BTS">BTS</option>
      <option value="SEVENTEEN">SEVENTEEN</option>
      <option value="Stray Kids">Stray Kids</option>
    </select>
  </section>

  <main class="container">
    <section id="productos">
      <h2>Productos</h2>
      <div id="productGrid" class="grid"></div>
    </section>
  </main>

  <aside id="cartPanel" class="cart-panel">
    <div class="cart-header">
      <h3>Tu carrito</h3>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <strong>$<span id="cartTotal">0</span> MXN</strong>
      </div>
      <button id="checkoutBtn" class="primary-btn">Pagar por WhatsApp</button>
      <p class="checkout-note">Mercado Pago se conectará en la siguiente etapa.</p>
    </div>
  </aside>

  <a class="whatsapp-float" href="https://wa.me/522311325814" target="_blank">WhatsApp</a>

  <script src="app.js"></script>
</body>
</html>
